name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configure local.properties with OANDA API Key
        run: |
          echo "OANDA_API_KEY=${{ secrets.OANDA_API_KEY || 'af2cbf06afafb47fde5549338fffa54e-938b48b11be124229f8a5435d3fae0fc' }}" > local.properties

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK with Gradle
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Display and publish build log
        if: always()
        run: |
          echo "=== BUILD LOG (LAST 250 LINES) ==="
          tail -n 250 build.log || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-build-log
          cp build.log build_errors.txt
          git add build_errors.txt
          git commit -m "ci: publish build log [skip ci]" || true
          git push origin ci-build-log -f || true

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiteCharts-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
